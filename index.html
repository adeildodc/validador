        body.theme-greenn {

                radial-gradient(at 50% 100%, rgba(5, 150, 105, 0.12) 0px, transparent 50%);

        body.theme-tmb {

        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .glass-input {
            background: rgba(31, 41, 55, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-input:focus {
            border-color: rgba(99, 102, 241, 0.6);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
        }

        .glow-button {
            position: relative;
            transition: all 0.3s ease;
        }

        .glow-button::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, #6366f1, #a855f7, #10b981);
            border-radius: 0.5rem;
            z-index: -1;
            opacity: 0;
            filter: blur(10px);
            transition: opacity 0.3s ease;
        }

        .glow-button:hover::after {
            opacity: 0.8;
        }

        /* Custom Switch Styling */
        .switch-checkbox:checked + .switch-label {
            background: linear-gradient(90deg, #10b981, #059669);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        .switch-checkbox:checked + .switch-label .switch-ball {
            transform: translateX(1.5rem);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {

            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.7);

            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;

    <!-- Firebase SDK Imports & Storage Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQ4Zn0c2z4ogdSwBD364cvmm3NSkoBC6I",
            authDomain: "joice-ac6ed.firebaseapp.com",
            projectId: "joice-ac6ed",
            storageBucket: "joice-ac6ed.firebasestorage.app",
            messagingSenderId: "956744607142",
            appId: "1:956744607142:web:865c5bf044ab91f1429b67",
            measurementId: "G-5M2PDJR9KB"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.initStorage = async function() {
            window.loadValidationStateFromLocalStorage();

            try {
                await signInAnonymously(auth);

                window.firestoreDb = db;
                window.docFunc = doc;
                window.setDocFunc = setDoc;

                const docRef = doc(db, 'catalogo', 'validacoes');

                onSnapshot(docRef, (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        validatedHotmart.clear();
                        validatedGreenn.clear();
                        validatedTmb.clear();

                        if (Array.isArray(data.hotmart)) data.hotmart.forEach(num => validatedHotmart.add(num));
                        if (Array.isArray(data.greenn)) data.greenn.forEach(num => validatedGreenn.add(num));
                        if (Array.isArray(data.tmb)) data.tmb.forEach(num => validatedTmb.add(num));

                        if (typeof updateProgressStats === 'function') updateProgressStats();
                        if (typeof loadProduct === 'function' && typeof currentIndex !== 'undefined') loadProduct(currentIndex);
                    }
                }, (err) => {
                    console.warn("Aviso na escuta em tempo real do Firestore:", err);
                });

            } catch (err) {
                console.warn("Erro ao inicializar Firebase (usando salvamento local):", err);
            }
        };
    </script>

        function saveValidationState() {
            const hotmartArr = Array.from(validatedHotmart);
            const greennArr = Array.from(validatedGreenn);
            const tmbArr = Array.from(validatedTmb);

            try {
                localStorage.setItem('validador_hotmart', JSON.stringify(hotmartArr));
                localStorage.setItem('validador_greenn', JSON.stringify(greennArr));
                localStorage.setItem('validador_tmb', JSON.stringify(tmbArr));
            } catch (e) {
                console.warn('Erro ao salvar no navegador:', e);
            }

            if (window.firestoreDb && window.setDocFunc && window.docFunc) {
                const docRef = window.docFunc(window.firestoreDb, 'catalogo', 'validacoes');
                window.setDocFunc(docRef, {
                    hotmart: hotmartArr,
                    greenn: greennArr,
                    tmb: tmbArr,
                    updatedAt: new Date().toISOString()
                }, { merge: true }).catch(err => console.error("Erro ao salvar no Firestore:", err));
            }
        }

        function loadValidationStateFromLocalStorage() {
            try {
                const h = localStorage.getItem('validador_hotmart');
                if (h) {
                    const parsed = JSON.parse(h);
                    if (Array.isArray(parsed)) parsed.forEach(num => validatedHotmart.add(num));
                }
                const g = localStorage.getItem('validador_greenn');
                if (g) {
                    const parsed = JSON.parse(g);
                    if (Array.isArray(parsed)) parsed.forEach(num => validatedGreenn.add(num));
                }
                const t = localStorage.getItem('validador_tmb');
                if (t) {
                    const parsed = JSON.parse(t);
                    if (Array.isArray(parsed)) parsed.forEach(num => validatedTmb.add(num));
                }
            } catch (e) {
                console.warn('Erro ao carregar do navegador:', e);
            }
        }
        window.loadValidationStateFromLocalStorage = loadValidationStateFromLocalStorage;

        function loadProduct(index) {
            const dataset = getActiveDataset();
            if (index < 0 || index >= dataset.length) return;
            
            currentIndex = index;
            const item = dataset[currentIndex];
            const validatedSet = getActiveValidatedSet();

            const numEl = document.getElementById('displayNum');
            const nameEl = document.getElementById('productNameInput');
            const extraLabel = document.getElementById('extraInfoLabel');
            const extraValue = document.getElementById('displayExtraValue');
            const statusEl = document.getElementById('displayStatus');

            if (numEl) numEl.textContent = item.num;
            if (nameEl) nameEl.value = item.name;

            if (currentPlatform === 'hotmart') {
                if (extraLabel) extraLabel.textContent = 'ID:';
                if (extraValue) extraValue.textContent = item.id;
            } else {
                if (extraLabel) extraLabel.textContent = 'Valor:';
                if (extraValue) extraValue.textContent = item.valor;
            }

            if (statusEl) {
                const statusText = item.status || "Ativos";
                const isAtivo = statusText.toLowerCase().includes('ativo');
                if (isAtivo) {
                    statusEl.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                    statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span>${statusText}`;
                } else {
                    statusEl.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20';
                    statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span>${statusText}`;
                }
            }

            const checkbox = document.getElementById('validationCheckbox');
            if (checkbox) checkbox.checked = validatedSet.has(item.num);

            const nextBadge = document.getElementById('nextItemBadge');
            if (nextBadge) {
                if (currentIndex + 1 < dataset.length) {
                    nextBadge.textContent = `#${dataset[currentIndex + 1].num}`;
                } else {
                    nextBadge.textContent = 'Fim';
                }
            }

            resetCopyButton();
        }

        function copyToClipboard() {
            const inputEl = document.getElementById('productNameInput');
            const copyBtnText = document.getElementById('copyBtnText');
            const copyBtn = document.getElementById('copyBtn');

            if (!inputEl) return;

            inputEl.select();
            
            try {
                document.execCommand('copy');
                if (copyBtnText) copyBtnText.textContent = 'Copiado!';
                if (copyBtn) {
                    copyBtn.classList.remove('bg-orange-600', 'bg-emerald-600', 'bg-purple-600');
                    copyBtn.classList.add('bg-emerald-600');
                }
                setTimeout(resetCopyButton, 2000);
            } catch (err) {
                if (copyBtnText) copyBtnText.textContent = 'Erro ao copiar';
            }
        }

        function resetCopyButton() {
            const copyBtnText = document.getElementById('copyBtnText');
            const copyBtn = document.getElementById('copyBtn');
            if (copyBtnText) copyBtnText.textContent = 'Copiar Nome';
            if (copyBtn) {
                const bgClass = currentPlatform === 'hotmart' ? 'bg-orange-600 hover:bg-orange-500' : currentPlatform === 'greenn' ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-purple-600 hover:bg-purple-500';
                copyBtn.className = `absolute right-3 bottom-3 glow-button ${bgClass} text-white font-semibold text-xs px-4 py-2.5 rounded-xl flex items-center gap-2 transition shadow-lg active:scale-95`;
            }
            const copyExtraBtnText = document.getElementById('copyExtraBtnText');
            if (copyExtraBtnText) copyExtraBtnText.textContent = 'Copiar';
        }

        function copyExtraToClipboard() {
            const extraVal = document.getElementById('displayExtraValue')?.textContent || '';
            const labelText = document.getElementById('extraInfoLabel')?.textContent || 'Código';
            const copyExtraBtnText = document.getElementById('copyExtraBtnText');

            if (!extraVal) return;

            const tempInput = document.createElement('textarea');
            tempInput.value = extraVal;
            document.body.appendChild(tempInput);
            tempInput.select();

            try {
                document.execCommand('copy');
                if (copyExtraBtnText) copyExtraBtnText.textContent = 'Copiado!';
                showToast(`${labelText} (${extraVal}) copiado com sucesso!`, "check-circle", "emerald");
                setTimeout(() => {
                    if (copyExtraBtnText) copyExtraBtnText.textContent = 'Copiar';
                }, 2000);
            } catch (err) {
                showToast('Erro ao copiar código', 'alert-circle', 'rose');
            } finally {
                document.body.removeChild(tempInput);
            }
        }

        function toggleValidationStatus() {
            const dataset = getActiveDataset();
            const currentNum = dataset[currentIndex].num;
            const validatedSet = getActiveValidatedSet();
            const checkbox = document.getElementById('validationCheckbox');
            
            if (checkbox && checkbox.checked) {
                validatedSet.add(currentNum);
            } else {
                validatedSet.delete(currentNum);
            }

            saveValidationState();
            updateProgressStats();
        }

        function selectAllItems() {
            const dataset = getActiveDataset();
            const validatedSet = getActiveValidatedSet();
            dataset.forEach(item => validatedSet.add(item.num));
            
            const checkbox = document.getElementById('validationCheckbox');
            if (checkbox) checkbox.checked = true;
            saveValidationState();
            updateProgressStats();
            showToast(`Todos os ${dataset.length} produtos de ${currentPlatform.toUpperCase()} marcados!`, "check-circle", "emerald");
        }

        function unselectAllItems() {
            const validatedSet = getActiveValidatedSet();
            validatedSet.clear();
            const checkbox = document.getElementById('validationCheckbox');
            if (checkbox) checkbox.checked = false;
            saveValidationState();
            updateProgressStats();
            showToast(`Todos os produtos de ${currentPlatform.toUpperCase()} desmarcados!`, "rotate-ccw", "rose");
        }

        // Toast Feedback System
        function showToast(message, iconName = "info", color = "orange") {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');
            const iconContainer = document.getElementById('toastIconContainer');

            if (!toast || !toastMsg) return;

            toastMsg.textContent = message;
            if (toastIcon) toastIcon.setAttribute('data-lucide', iconName);
            
            if (iconContainer) {
                if (color === "emerald") {
                    iconContainer.className = "p-1 rounded-lg bg-emerald-500/20 text-emerald-400";
                } else if (color === "rose") {
                    iconContainer.className = "p-1 rounded-lg bg-rose-500/20 text-rose-400";
                } else if (color === "purple") {
                    iconContainer.className = "p-1 rounded-lg bg-purple-500/20 text-purple-400";
                } else {
                    iconContainer.className = "p-1 rounded-lg bg-orange-500/20 text-orange-400";
                }
            }

            if (window.lucide) window.lucide.createIcons();

            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');

            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function updateProgressStats() {
            const dataset = getActiveDataset();
            const validatedSet = getActiveValidatedSet();
            const total = dataset.length;
            const count = validatedSet.size;
            const percentage = Math.round((count / total) * 100);

            const countEl = document.getElementById('validatedCount');
            const totalEl = document.getElementById('totalPlatformCount');
            const pctEl = document.getElementById('percentageText');
            const barEl = document.getElementById('topProgressBar');

            if (countEl) countEl.textContent = count;
            if (totalEl) totalEl.textContent = total;
            if (pctEl) pctEl.textContent = `${percentage}%`;
            if (barEl) barEl.style.width = `${percentage}%`;
        }

        function nextItem() {
            const dataset = getActiveDataset();
            if (currentIndex < dataset.length - 1) {
                loadProduct(currentIndex + 1);
            }
        }

        function previousItem() {
            if (currentIndex > 0) {
                loadProduct(currentIndex - 1);
            }
        }

        function removeAcentos(texto) {
            if (!texto) return '';
            return texto
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase();
        }

        function onSearchInput() {
            const searchInput = document.getElementById('searchInput');
            if (!searchInput) return;

            const query = removeAcentos(searchInput.value.trim());
            const resultsContainer = document.getElementById('searchResults');
            const clearBtn = document.getElementById('clearSearchBtn');
            const dataset = getActiveDataset();
            const validatedSet = getActiveValidatedSet();

            if (!query) {
                if (resultsContainer) resultsContainer.classList.add('hidden');
                if (clearBtn) clearBtn.classList.add('hidden');
                return;
            }

            if (clearBtn) clearBtn.classList.remove('hidden');

            const matches = dataset.filter(item => {
                const itemNumStr = item.num.toString();
                const matchNum = itemNumStr === query || `${itemNumStr}º` === query || `${itemNumStr}` === query;
                const matchName = removeAcentos(item.name).includes(query);
                const extraText = currentPlatform === 'hotmart' ? item.id : item.valor;
                const matchExtra = removeAcentos(extraText).includes(query);

                return matchNum || matchName || matchExtra;
            });

            if (resultsContainer) {
                if (matches.length > 0) {
                    resultsContainer.innerHTML = '';
                    matches.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'p-3.5 hover:bg-slate-800/50 cursor-pointer flex justify-between items-center transition group';
                        
                        const isValidated = validatedSet.has(item.num);
                        const checkIcon = isValidated ? `<span class="text-emerald-400 text-xs font-semibold flex items-center gap-1"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Validado</span>` : '';
                        const extraBadge = currentPlatform === 'hotmart' ? `ID: ${item.id}` : `${item.valor}`;

                        div.innerHTML = `
                            <div class="flex items-center gap-3">
                                <span class="px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-mono text-xs font-bold border border-slate-700">#${item.num}</span>
                                <span class="text-sm font-medium text-slate-200 group-hover:text-amber-300 transition">${item.name}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                ${checkIcon}
                                <span class="text-xs font-mono text-slate-400 bg-slate-900/50 px-2 py-1 rounded">${extraBadge}</span>
                            </div>
                        `;
                        div.onclick = () => {
                            loadProduct(item.num - 1);
                            resultsContainer.classList.add('hidden');
                            searchInput.value = '';
                            if (clearBtn) clearBtn.classList.add('hidden');
                        };
                        resultsContainer.appendChild(div);
                    });
                    resultsContainer.classList.remove('hidden');
                    if (window.lucide) window.lucide.createIcons();
                } else {
                    resultsContainer.innerHTML = `<div class="p-4 text-xs text-slate-400 text-center">Nenhum produto encontrado em ${currentPlatform.toUpperCase()}.</div>`;
                    resultsContainer.classList.remove('hidden');
                }
            }
        }

        function clearSearch() {
            const searchInput = document.getElementById('searchInput');
            const resultsContainer = document.getElementById('searchResults');
            const clearBtn = document.getElementById('clearSearchBtn');

            if (searchInput) searchInput.value = '';
            if (resultsContainer) resultsContainer.classList.add('hidden');
            if (clearBtn) clearBtn.classList.add('hidden');
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;

            if (e.key === 'ArrowRight') {
                nextItem();
            } else if (e.key === 'ArrowLeft') {
                previousItem();
            }
        });

        // Click outside search listener
        document.addEventListener('click', (e) => {
            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResults');
            if (searchInput && searchResults && !searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.add('hidden');
            }
        });

        // Initialize App
        window.onload = function() {
            if (window.lucide) window.lucide.createIcons();
            if (window.initStorage) {
                window.initStorage();
            } else {
                loadValidationStateFromLocalStorage();
            }
            loadProduct(0);
            updateProgressStats();
        };
