    <!-- Firebase SDK Imports & Storage Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, addDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.initStorage = async function() {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'validador-pro-app';
            
            // 1. Carrega do localStorage local
            window.loadValidationStateFromLocalStorage();

            // 2. Se houver ambiente Firebase ativo, habilita sincronização em tempo real compartilhada
            if (typeof __firebase_config !== 'undefined') {
                try {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const app = initializeApp(firebaseConfig);
                    const auth = getAuth(app);
                    const db = getFirestore(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    
                    window.firestoreDb = db;
                    window.firestoreAppId = appId;
                    window.docFunc = doc;
                    window.setDocFunc = setDoc;
                    window.addDocFunc = addDoc;
                    window.collectionFunc = collection;

                    // Escuta em tempo real o documento PÚBLICO para sincronizar entre todos os navegadores
                    const publicDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'validationState', 'shared');
                    
                    onSnapshot(publicDocRef, (snap) => {
                        if (snap.exists()) {
                            const data = snap.data();
                            if (Array.isArray(data.hotmart)) {
                                validatedHotmart.clear();
                                data.hotmart.forEach(num => validatedHotmart.add(num));
                            }
                            if (Array.isArray(data.greenn)) {
                                validatedGreenn.clear();
                                data.greenn.forEach(num => validatedGreenn.add(num));
                            }
                            // Salva também no localStorage para backup offline
                            try {
                                localStorage.setItem('validador_hotmart', JSON.stringify(Array.from(validatedHotmart)));
                                localStorage.setItem('validador_greenn', JSON.stringify(Array.from(validatedGreenn)));
                            } catch(e){}

                            if (typeof updateProgressStats === 'function') updateProgressStats();
                            if (typeof loadProduct === 'function' && typeof currentIndex !== 'undefined') loadProduct(currentIndex);
                        }
                    }, (err) => console.warn("Erro no listener em tempo real:", err));

                } catch (err) {
                    console.warn("Sincronização em nuvem opcional não disponível:", err);
                }
            }
        };
    </script>

        async function saveProductToFirebase(event) {
            event.preventDefault();
            
            const platform = document.getElementById('newProdPlatform').value;
            const name = document.getElementById('newProdName').value.trim();
            const codeOrVal = document.getElementById('newProdCodeOrVal').value.trim();
            const status = document.getElementById('newProdStatus').value;

            if (!name || !codeOrVal) {
                showToast("Preencha todos os campos obrigatórios!", "alert-circle", "rose");
                return;
            }

            const targetDataset = platform === 'hotmart' ? hotmartProducts : greennProducts;
            const newNum = targetDataset.length + 1;

            const newProduct = {
                num: newNum,
                name: name,
                status: status
            };

            if (platform === 'hotmart') {
                newProduct.id = codeOrVal;
            } else {
                newProduct.valor = codeOrVal.startsWith('R$') ? codeOrVal : `R$ ${codeOrVal}`;
            }

            // Adiciona localmente ao array correspondente
            targetDataset.push(newProduct);

            // Grava no Firebase Firestore se a conexão estiver ativa
            if (window.firestoreDb && window.addDocFunc && window.collectionFunc) {
                try {
                    const appId = window.firestoreAppId || 'validador-pro-app';
                    // Regra de caminho obrigatória: /artifacts/{appId}/public/data/{collectionName}
                    const collectionRef = window.collectionFunc(window.firestoreDb, 'artifacts', appId, 'public', 'data', 'produtos');
                    
                    await window.addDocFunc(collectionRef, {
                        ...newProduct,
                        platform: platform,
                        createdAt: new Date().toISOString()
                    });
                    
                    showToast(`Produto cadastrado com sucesso no Firebase!`, "database", "emerald");

            } else {

            }

            // Atualiza interface da plataforma ativa
            if (currentPlatform === platform) {
                loadProduct(targetDataset.length - 1);
                updateProgressStats();
            } else {
                switchPlatform(platform);
                loadProduct(targetDataset.length - 1);
            }

            // Limpa o formulário e fecha modal
            document.getElementById('newProdName').value = '';
            document.getElementById('newProdCodeOrVal').value = '';
            closeAddModal();
        }
